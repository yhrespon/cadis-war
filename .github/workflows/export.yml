name: CADIS WAR Android Export

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          yes | sdkmanager --licenses || true

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          godot --version

      - name: Detect Godot project
        run: |
          find . -name project.godot -print
          find . -name export_presets.cfg -print

      - name: Prepare build
        run: |
          mkdir -p build

      - name: Import project
        run: |
          cd godot_project
          godot --headless --editor --quit

      - name: Export Android
        run: |
          cd godot_project
          godot --headless \
            --export-debug "Android" \
            ../build/CADIS-WAR-debug.apk

      - name: Check APK
        run: |
          ls -lh build/
          test -f build/CADIS-WAR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-Android
          path: build/CADIS-WAR-debug.apk
          if-no-files-found: error
