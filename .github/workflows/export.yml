name: CADIS WAR Android Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses || true

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          JAVA_PATH="$(realpath "$JAVA_HOME")"
          ANDROID_PATH="$(realpath "$ANDROID_HOME")"

          test -x "$JAVA_PATH/bin/java"
          test -x "$JAVA_PATH/bin/keytool"
          test -x "$ANDROID_PATH/platform-tools/adb"
          test -d "$ANDROID_PATH/platforms/android-34"
          test -d "$ANDROID_PATH/build-tools/34.0.0"

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$ANDROID_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "===== JAVA ====="
          "$JAVA_PATH/bin/java" -version

          echo "===== GODOT SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Validate project Android configuration
        working-directory: godot_project
        run: |
          echo "===== EXPORT PRESET ====="
          grep -E 'min_sdk|target_sdk|package/unique_name|package/name' export_presets.cfg

          echo "===== PROJECT ====="
          grep -E 'config/name|config/features|run/main_scene' project.godot

      - name: Import project
        working-directory: godot_project
        run: |
          godot --headless --editor --quit

      - name: Export APK
        working-directory: godot_project
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            build/CADIS-WAR-debug.apk

      - name: Verify APK
        working-directory: godot_project
        run: |
          ls -lh build/CADIS-WAR-debug.apk
          test -s build/CADIS-WAR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-Android
          path: godot_project/build/CADIS-WAR-debug.apk
          if-no-files-found: error
