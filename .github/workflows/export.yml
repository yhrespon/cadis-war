name: CADIS WAR - Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest"

      - name: Setup Godot 4.3
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true
          cache: true

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          godot --version

      - name: Check project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          echo "Project Godot détecté"
          echo "Export presets détecté"

      - name: Import project
        run: |
          godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/CADIS-WAR-debug.apk

      - name: Verify APK
        run: |
          ls -lh build/
          test -f build/CADIS-WAR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-Android
          path: build/CADIS-WAR-debug.apk
          if-no-files-found: error
