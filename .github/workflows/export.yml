name: CADIS WAR Android Export

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses || true

      - name: Verify Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot 4.3 Android
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          JDK_PATH="$(cd "$JAVA_HOME" && pwd -P)"
          ANDROID_PATH="$(cd "$ANDROID_HOME" && pwd -P)"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JDK_PATH"
          export/android/android_sdk_path = "$ANDROID_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "===== GODOT 4.3 SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=============================="

      - name: Locate Godot project
        id: project
        run: |
          PROJECT_FILE="$(find . -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Import project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          godot --headless --editor --quit

      - name: Export Android APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --export-debug "Android" \
            build/CADIS-WAR-debug.apk

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ls -lh build/
          test -f build/CADIS-WAR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-Android
          path: ${{ steps.project.outputs.project_dir }}/build/CADIS-WAR-debug.apk
          if-no-files-found: error
