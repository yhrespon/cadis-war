name: Build CADIS WAR Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "cmdline-tools;latest"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          include-templates: true

      - name: Configure Godot Android environment
        shell: bash
        run: |
          set -eux

          JDK_PATH="${JAVA_HOME}"
          ANDROID_PATH="${ANDROID_HOME}"

          echo "JAVA_HOME=$JDK_PATH"
          echo "ANDROID_HOME=$ANDROID_PATH"

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JDK_PATH"
          export/android/android_sdk_path = "$ANDROID_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

          cp "$HOME/.config/godot/editor_settings-4.3.tres" \
             "$HOME/.config/godot/editor_settings-4.tres"

          echo "===== JAVA ====="
          "$JDK_PATH/bin/java" -version

          echo "===== ANDROID SDK ====="
          ls -la "$ANDROID_PATH"
          ls -la "$ANDROID_PATH/build-tools"
          ls -la "$ANDROID_PATH/platforms"

          echo "===== GODOT SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Locate Godot project
        shell: bash
        run: |
          set -eux
          PROJECT_DIR="$(find . -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Verify Android environment
        shell: bash
        run: |
          set -eux

          echo "===== ENV ====="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

          echo "===== PLATFORM ====="
          ls -la "$ANDROID_HOME/platforms/android-34"

          echo "===== JAVA ====="
          "$JAVA_HOME/bin/java" -version

      - name: Validate Godot project
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          godot --headless --editor --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --verbose --export-debug \
            "Android" build/CADIS-WAR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-debug
          path: "${{ env.PROJECT_DIR }}/build/CADIS-WAR-debug.apk"
          if-no-files-found: error
