name: Build CADIS WAR Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          include-templates: true

      - name: Locate Godot project
        shell: bash
        run: |
          set -eux
          PROJECT_DIR="$(find . -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Configure Android for Godot
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          echo "===== JAVA ====="
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "===== CREATE DEBUG KEYSTORE ====="
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "===== GODOT EDITOR SETTINGS ====="

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
SETTINGS

          cat "$HOME/.config/godot/editor_settings-4.tres"

          echo "===== GODOT 4.3 SETTINGS ====="
          cp "$HOME/.config/godot/editor_settings-4.tres" \
             "$HOME/.config/godot/editor_settings-4.3.tres"

          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Verify Android export preset
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "===== ANDROID PRESET ====="
          grep -n \
            -E 'gradle_build/min_sdk|gradle_build/target_sdk' \
            export_presets.cfg

          grep -q 'gradle_build/min_sdk="26"' export_presets.cfg
          grep -q 'gradle_build/target_sdk="34"' export_presets.cfg

      - name: Export Android APK
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"
          mkdir -p build

          echo "===== FINAL JAVA ====="
          "$JAVA_HOME/bin/java" -version

          echo "===== FINAL SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"
          ls -la "$ANDROID_HOME/platforms/android-34"

          echo "===== FINAL GODOT SETTINGS ====="
          cat "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

          echo "===== GODOT VERSION ====="
          godot --version

          echo "===== EXPORT ====="
          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "$PWD/build/CADIS-WAR-debug.apk"

          test -f "$PWD/build/CADIS-WAR-debug.apk"
          ls -lh "$PWD/build/CADIS-WAR-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CADIS-WAR-debug
          path: "${{ env.PROJECT_DIR }}/build/CADIS-WAR-debug.apk"
          if-no-files-found: error
